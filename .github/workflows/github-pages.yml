name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# upload-pages-artifact writes Pages artifacts; configure-pages may create the site when policy allows.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Export static dashboard data
        run: python scripts/export_github_pages.py --with-demo-train

      # For private org repos, a repo admin may need Settings → Pages → Build and deployment → Source: GitHub Actions
      # before this step succeeds. GitHub Pages on private repositories requires a public repo or GitHub Enterprise.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4