name: Fault check

on:
  schedule:
    # 07:00 in Asia/Colombo. GitHub may start this late.
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  faults:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check readings against the forecast baseline
        run: python -m api.fault_job
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
