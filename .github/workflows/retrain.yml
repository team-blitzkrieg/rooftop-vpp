name: Weekly retrain

on:
  schedule:
    # Sunday 18:30 UTC is Monday 00:00 in Asia/Colombo.
    - cron: "30 18 * * 0"
  workflow_dispatch:
    inputs:
      allow_synthetic:
        description: Train on SIMULATED rows. Leave this false for a real retrain.
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Retrain and maybe promote
        run: python -m api.jobs retrain
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_MODEL_BUCKET: models
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ALLOW_SYNTHETIC: ${{ github.event.inputs.allow_synthetic || 'false' }}
