name: Hourly forecast

on:
  schedule:
    # 15 minutes past the hour, so it does not pile onto the :00 workflows.
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # GitHub often starts this cron late, or skips an hour. The job still
      # has to move issued_at when it does run. With no promoted model it
      # refreshes the simulated forecast instead of exiting after a no-op.
      - name: Write the next 24 hours
        run: python -m api.jobs forecast
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
