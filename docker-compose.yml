# Local only. The free deployment is Supabase plus GitHub Actions plus Render
# or Hugging Face Spaces. See DEPLOY.md.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rooftop
      POSTGRES_PASSWORD: rooftop
      POSTGRES_DB: rooftop
    ports:
      - "5432:5432"
    volumes:
      - ./api/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://rooftop:rooftop@db:5432/rooftop
      PORT: "8000"
    depends_on:
      - db
